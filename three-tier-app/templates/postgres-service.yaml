apiVersion: v1
kind: Service
metadata:
  name: {{ include "three-tier-app.postgres.fullname" . }}
  labels:
    {{- include "three-tier-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: {{ .Values.postgres.service.type }}
  selector:
    {{- include "three-tier-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
      protocol: TCP
