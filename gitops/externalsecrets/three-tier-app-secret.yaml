apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: myapp-three-tier-app-postgres-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: myapp-three-tier-app-postgres-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
        database: "{{ .database }}"
  data:
    - secretKey: username
      remoteRef:
        key: three-tier-app/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: three-tier-app/postgres
        property: password
    - secretKey: database
      remoteRef:
        key: three-tier-app/postgres
        property: database
